<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Talking Travel - сообщество путешественников</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
       
        <link rel="stylesheet" href="./css/style.css">
    </head>

    <body>

    <!-- Хедер с отступами -->
    <header class="header">
        <!-- Логотип -->
        <div class="logo">
            <span class="logo-top">Talking</span>
            <span class="logo-bottom">Travel</span>
        </div>

        <!-- Правая часть -->
        <div class="right-side">
            
            <!-- Меню -->
            <nav class="nav">
                <a href="#" class="active">Home</a>
                <a href="#">Story</a>
                <a href="#">Gallery</a>
                <a href="#">Contact Us</a>
            </nav>

            <!-- Линия -->
            <div class="separator"></div>

            <!-- Иконки -->
            <div class="icons">
                <img class="icon" src="img/Лупа.png">
                <img class="icon" src="img/Профиль.png">
            </div>

        </div>
    </header>

    <section class="hero-block">
        <div class="container">
            <h1 class="hero__title">
                <span class="hero__title-accent">Let's talk</span> about<br>
                your next trip!
                </h1>
            <p class="hero__description">Share your favorite travel destination and we will<br>
                feature it in our next blog!</p>
            <div class="hero__actions">
                <a class="button button--primary" href="#share">
                    Share your story</a>
                <a class="button button--secondary" href="#video">
                    <img class="icon--video" src="img/Видео.png">
                    Watch highlights
                </a>
            </div>
        </div>
       
    </section>
    </body>
</html>
